<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World Cup Quiniela Standings</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 32px;
    }

    /* ✅ Container with horizontal scroll */
    .table-container {
      max-width: 1000px;
      margin: auto;
      background: #111827;
      border-radius: 16px;
      overflow-x: auto; /* 🔥 SCROLL FIX */
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px; /* ensures columns don’t get squished */
    }

    th {
      background: #1f2937;
      padding: 14px;
      font-size: 13px;
      text-transform: uppercase;
      color: #9ca3af;

      /* ✅ sticky header */
      position: sticky;
      top: 0;
      z-index: 2;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #374151;
      white-space: nowrap; /* ✅ prevents wrapping */
    }

    tr:hover {
      background-color: #1f2937;
    }

    .rank {
      font-weight: bold;
      font-size: 16px;
    }

    .gold { background: #064e3b; }
    .silver { background: #78350f; }
    .bronze { background: #1e3a8a; }

    .name {
      text-align: left;
      padding-left: 20px;
      font-weight: 500;

      /* ✅ stick first column */
      position: sticky;
      left: 0;
      background: #111827;
    }
  </style>
</head>
<body>

<h1>⚽ World Cup Quiniela Standings</h1>

<div class="table-container">
  <div id="table">Loading...</div>
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv";

fetch(url)
  .then(res => res.text())
  .then(data => {
    let rows = data.trim().split("\n").map(r => r.split(","));

    const headers = rows[0];
    let body = rows.slice(1);

    // ✅ AUTO SORT by LAST COLUMN (Points)
    body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

    let html = "<table>";

    // Header
    html += "<tr><th>#</th>";
    headers.forEach(h => html += `<th>${h}</th>`);
    html += "</tr>";

    // Rows
    body.forEach((row, i) => {
      let medal = "";
      let rowClass = "";

      if (i === 0) { medal = "🥇"; rowClass = "gold"; }
      else if (i === 1) { medal = "🥈"; rowClass = "silver"; }
      else if (i === 2) { medal = "🥉"; rowClass = "bronze"; }

      html += `<tr class="${rowClass}">`;

      html += `<td class="rank">${medal || (i + 1)}</td>`;

      row.forEach((cell, idx) => {
        if (idx === 0) {
          html += `<td class="name">${cell}</td>`;
        } else {
          html += `<td>${cell}</td>`;
        }
      });

      html += "</tr>";
    });

    html += "</table>";
    document.getElementById("table").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("table").innerHTML = "Error loading data";
    console.error(err);
  });
</script>

</body>
</html>
