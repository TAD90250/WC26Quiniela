<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

/* ✅ Tabs */
.nav {
  margin-bottom: 20px;
}

.nav button {
  padding: 10px 20px;
  margin: 5px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
}

/* ✅ Container */
.table-container {
  max-width: 1600px;
  margin: auto;
  background: #111827;
  border-radius: 16px;
  overflow-x: auto;
}

/* ✅ Hide inactive tabs */
.tab {
  display: none;
}

.tab.active {
  display: block;
}

/* ✅ Table */
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1400px;
}

th {
  background: #1f2937;
  padding: 10px;
  font-size: 12px;
  color: #9ca3af;
  position: sticky;
  top: 0;
}

td {
  padding: 10px;
  border-bottom: 1px solid #374151;
  white-space: nowrap;
}

/* ✅ Wrap Column B (Standings only) */
#standings td:nth-child(3),
#standings th:nth-child(3) {
  white-space: normal;
  word-break: break-word;
  max-width: 250px;
}

/* ✅ Sticky first column */
.name {
  position: sticky;
  left: 0;
  background: #111827;
}

/* ✅ Styles */
.rank { font-weight: bold; }
.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

tr:hover {
  background: #1f2937;
}
</style>
</head>

<body>

<h1>⚽ Mundial 2026 Quiniela</h1>

<!-- ✅ Tabs -->
<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
</div>

<!-- ✅ Standings -->
<div id="standings" class="tab active">
  <div class="table-container">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- ✅ Team Stats -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<script>
/* ✅ Tab switching */
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ Standings TABLE */
const standingsURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv";

fetch(standingsURL)
.then(res => res.text())
.then(data => {

  let rows = data.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  let body = rows.slice(1);

  /* ✅ Sort by last column */
  body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

  let html = "<table>";

  html += "<tr><th>#</th>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  body.forEach((row, i) => {
    let medal = "";
    let cls = "";

    if (i === 0) { medal = "🥇"; cls = "gold"; }
    else if (i === 1) { medal = "🥈"; cls = "silver"; }
    else if (i === 2) { medal = "🥉"; cls = "bronze"; }

    html += `<tr class="${cls}">`;
    html += `<td class="rank">${medal || (i + 1)}</td>`;

    row.forEach((cell, idx) => {
      if (idx === 0) {
        html += `<td class="name">${cell}</td>`;
      } else {
        html += `<td>${cell}</td>`;
      }
    });

    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("table1").innerHTML = html;
})
.catch(err => {
  console.error("Standings error:", err);
  document.getElementById("table1").innerHTML = "Error loading standings";
});

/* ✅ Team Stats TABLE */
const statsURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&single=true&output=csv";

fetch(statsURL)
.then(res => res.text())
.then(data => {

  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "<table>";

  rows.forEach((row, i) => {
    html += "<tr>";
    row.forEach(cell => {
      html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("table2").innerHTML = html;
})
.catch(err => {
  console.error("Stats error:", err);
  document.getElementById("table2").innerHTML = "Error loading stats";
});
</script>

</body>
</html>
