<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

/* ✅ Tabs */
.nav {
  margin-bottom: 20px;
}

.nav button {
  padding: 10px 20px;
  margin: 5px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
}

/* ✅ Container */
.table-container {
  max-width: 1800px;
  margin: auto;
  background: #111827;
  border-radius: 16px;
  overflow-x: auto;
}

/* ✅ Tabs */
.tab {
  display: none;
}

.tab.active {
  display: block;
}

/* ✅ Table */
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1700px;
}

/* ✅ Header */
th {
  background: #1f2937;
  padding: 10px;
  font-size: 12px;
  color: #9ca3af;
  position: sticky;
  top: 0;
  white-space: nowrap;
}

/* ✅ Cells */
td {
  padding: 10px;
  border-bottom: 1px solid #374151;
  white-space: nowrap;
  font-size: 13px;
}

tr:hover {
  background: #1f2937;
}

/* ✅ Sticky Player column */
.name {
  position: sticky;
  left: 0;
  background: #111827;
  text-align: left;
  padding-left: 15px;
  font-weight: 500;
}

/* ✅ Rank */
.rank {
  font-weight: bold;
}

/* ✅ Top 3 */
.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

/* ✅ Column control */

/* Rank */
#standings th:nth-child(1),
#standings td:nth-child(1) {
  min-width: 50px;
  text-align: center;
}

/* Player */
#standings th:nth-child(2),
#standings td:nth-child(2) {
  min-width: 180px;
}

/* Points (FIXED ✅) */
#standings th:nth-child(3),
#standings td:nth-child(3) {
  min-width: 90px;
  text-align: center;
  white-space: nowrap;
}

/* Tier columns */
#standings th:nth-child(4),
#standings th:nth-child(5),
#standings th:nth-child(6),
#standings th:nth-child(7),
#standings td:nth-child(4),
#standings td:nth-child(5),
#standings td:nth-child(6),
#standings td:nth-child(7) {
  min-width: 130px;
}

/* Stats columns */
#standings th:nth-child(n+8),
#standings td:nth-child(n+8) {
  min-width: 70px;
  text-align: center;
}

/* Later rounds */
#standings th:nth-child(n+12),
#standings td:nth-child(n+12) {
  min-width: 120px;
}

</style>
</head>

<body>

<h1>⚽ Mundial 2026 Quiniela</h1>

<!-- ✅ Tabs -->
<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
</div>

<!-- ✅ Standings -->
<div id="standings" class="tab active">
  <div class="table-container">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- ✅ Team Stats -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<script>
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ Standings */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv")
.then(res => res.text())
.then(data => {

  let rows = data.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  let body = rows.slice(1);

  body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

  let html = "<table>";

  html += "<tr><th>#</th>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  body.forEach((row, i) => {
    let medal = "";
    let cls = "";

    if (i === 0) { medal = "🥇"; cls = "gold"; }
    else if (i === 1) { medal = "🥈"; cls = "silver"; }
    else if (i === 2) { medal = "🥉"; cls = "bronze"; }

    html += `<tr class="${cls}">`;
    html += `<td class="rank">${medal || (i + 1)}</td>`;

    row.forEach((cell, idx) => {
      if (idx === 0) {
        html += `<td class="name">${cell}</td>`;
      } else {
        html += `<td>${cell}</td>`;
      }
    });

    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("table1").innerHTML = html;
})
.catch(err => {
  console.error(err);
  document.getElementById("table1").innerHTML = "Error loading standings";
});

/* ✅ Team Stats */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&single=true&output=csv")
.then(res => res.text())
.then(data => {

  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "<table>";

  rows.forEach((row, i) => {
    html += "<tr>";
    row.forEach(cell => {
      html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("table2").innerHTML = html;
});
</script>

</body>
</html>
