<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  padding: 15px;
}

/* ✅ HEADER */
.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  margin-bottom: 15px;
}

.title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* ✅ POT (RIGHT SIDE) */
.pot-header {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}

/* ✅ Tabs LEFT */
.nav {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 15px;
  gap: 6px;
}

.nav button {
  padding: 8px 16px;
  background: #1f2937;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
}

/* rest of your CSS unchanged */
.tab { display: none; }
.tab.active { display: block; }

.table-container {
  width: 100%;
  background: #111827;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f2937;
  padding: 6px;
  font-size: 11px;
  color: #9ca3af;
  text-align: center;
}

td {
  padding: 6px;
  font-size: 11px;
  border-bottom: 1px solid #374151;
  text-align: center;
}

#standings td:nth-child(2),
#standings th:nth-child(2) {
  text-align: left;
  padding-left: 10px;
}

#standings th:nth-child(1), #standings td:nth-child(1) { width: 4ch; }
#standings th:nth-child(3), #standings td:nth-child(3) { width: 8ch; }
#standings th:nth-child(8), #standings td:nth-child(8),
#standings th:nth-child(9), #standings td:nth-child(9) { width: 6ch; }

#standings th:nth-child(2), #standings td:nth-child(2) { padding-right: 14px; }
#standings th:nth-child(7), #standings td:nth-child(7) { padding-right: 14px; }

.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

</style>
</head>

<body>

<!-- ✅ HEADER (POT RIGHT NOW) -->
<div class="header">
  <div></div>
  <div class="title">⚽ Mundial 2026 Quiniela</div>
  <div class="pot-header" id="potHeader">Loading...</div>
</div>

<!-- ✅ TABS LEFT -->
<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
  <button onclick="showTab('rules', this)">Point System</button>
</div>

<!-- STANDINGS -->
<div id="standings" class="tab active">
  <div class="table-container">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- STATS -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<script>
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ FIXED FETCH LINKS */

/* STANDINGS */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&output=csv")
.then(r=>r.text())
.then(data=>{
  let rows=data.trim().split("\n").map(r=>r.split(","));
  let headers=rows[0];
  let body=rows.slice(1);

  body.sort((a,b)=>Number(b[b.length-1])-Number(a[a.length-1]));

  let html="<table><tr><th>#</th>";
  headers.forEach(h=>html+=`<th>${h}</th>`);
  html+="</tr>";

  body.forEach((row,i)=>{
    let medal="",cls="";
    if(i===0){medal="🥇";cls="gold";}
    else if(i===1){medal="🥈";cls="silver";}
    else if(i===2){medal="🥉";cls="bronze";}

    html+=`<tr class="${cls}"><td>${medal||i+1}</td>`;
    row.forEach(c=>html+=`<td>${c}</td>`);
    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("table1").innerHTML=html;
});

/* STATS */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&output=csv")
.then(r=>r.text())
.then(data=>{
  let rows=data.trim().split("\n").map(r=>r.split(","));

  let html="<table>";
  rows.forEach((row,i)=>{
    html+="<tr>";
    row.forEach(c=>html+= i===0?`<th>${c}</th>`:`<td>${c}</td>`);
    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("table2").innerHTML=html;
});

/* POT */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=669574522&output=csv")
.then(r=>r.text())
.then(data=>{
  let rows=data.trim().split("\n").map(r=>r.split(","));

  let total=0, html="";
  rows.slice(1).forEach(row=>{
    let val=parseFloat(row[1].replace(/[$,]/g,""))||0;
    total+=val;

    html+=`<div class="pot-card">
      <div class="pot-title">${row[0]}</div>
      <div class="pot-value">$${val}</div>
    </div>`;
  });

  html=`<div class="pot-card total">
    <div>Total</div>
    <div class="pot-value">$${total}</div>
  </div>`+html;

  document.getElementById("potHeader").innerHTML=html;
});
</script>

</body>
</html>
``
