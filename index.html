<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  padding: 15px;
}

/* ✅ HEADER */
.header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  margin-bottom: 15px;
}

.title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* ✅ POT */
.pot-header {
  display: flex;
  gap: 12px;
}

.pot-card {
  background: #1f2937;
  padding: 10px 16px;
  border-radius: 10px;
  text-align: center;
  min-width: 90px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.pot-card.total {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.pot-title {
  font-size: 11px;
  color: #9ca3af;
}

.pot-value {
  font-size: 16px;
  font-weight: bold;
}

/* ✅ Tabs */
.nav {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 15px;
}

.nav button {
  padding: 8px 16px;
  margin: 0 6px;
  background: #1f2937;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
}

.tab { display: none; }
.tab.active { display: block; }

/* ✅ TABLE (original kept) */
.table-container {
  width: 100%;
  background: #111827;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  background: #1f2937;
  padding: 6px;
  font-size: 11px;
  color: #9ca3af;
  text-align: center;
}

td {
  padding: 6px;
  font-size: 11px;
  border-bottom: 1px solid #374151;
  text-align: center;
}

/* Player column */
#standings td:nth-child(2),
#standings th:nth-child(2) {
  text-align: left;
  padding-left: 10px;
}

/* ✅ Top 3 */
.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

/* ✅ RULES */
.rules-wrapper {
  max-width: 900px;
  margin: auto;
}

.rules-toggle {
  text-align: center;
  margin-bottom: 15px;
}

.rules-toggle button {
  margin: 0 5px;
  padding: 6px 12px;
  background: #1f2937;
  border: none;
  border-radius: 6px;
  color: white;
}

.rules-toggle button.active {
  background: #2563eb;
}

.rule-card {
  background: #111827;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.rule-card h3 {
  color: #60a5fa;
}

/* ✅ ✅ NEW (STANDINGS ONLY) */
.standings-table {
  max-width: 1600px;
  overflow-x: auto;
}

.standings-table table {
  min-width: 1400px;
}

.standings-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 10px;
  font-size: 12px;
}

.standings-table td {
  padding: 10px;
  font-size: 13px;
  white-space: nowrap;
}

.standings-table tr:hover {
  background-color: #1f2937;
}

.standings-table .name {
  position: sticky;
  left: 0;
  background: #111827;
  z-index: 1;
  text-align: left;
  padding-left: 15px;
}
</style>
</head>

<body>

<div class="header">
  <div></div>
  <div class="title">⚽ Mundial 2026 Quiniela</div>
  <div class="pot-header" id="potHeader">Loading...</div>
</div>

<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
  <button onclick="showTab('rules', this)">Point System</button>
</div>

<!-- ✅ STANDINGS (ONLY change: added class) -->
<div id="standings" class="tab active">
  <div class="table-container standings-table">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- ✅ STATS -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<script>
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ STANDINGS (ONLY loop changed) */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&output=csv")
.then(r=>r.text())
.then(data=>{
  let rows=data.trim().split("\n").map(r=>r.split(","));
  let headers=rows[0];
  let body=rows.slice(1);

  body.sort((a,b)=>Number(b[b.length-1])-Number(a[a.length-1]));

  let html="<table><tr><th>#</th>";
  headers.forEach(h=>html+=`<th>${h}</th>`);
  html+="</tr>";

  body.forEach((row,i)=>{
    let medal="",cls="";
    if(i===0){medal="🥇";cls="gold";}
    else if(i===1){medal="🥈";cls="silver";}
    else if(i===2){medal="🥉";cls="bronze";}

    html+=`<tr class="${cls}"><td>${medal||i+1}</td>`;

    row.forEach((cell, idx)=>{
      if(idx===0){
        html+=`<td class="name">${cell}</td>`;
      } else {
        html+=`<td>${cell}</td>`;
      }
    });

    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("table1").innerHTML=html;
});
</script>

</body>
</html>
