<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 15px;
}

h1 {
  margin-bottom: 15px;
  font-size: 22px;
}

/* ✅ Tabs */
.nav {
  margin-bottom: 15px;
}

.nav button {
  padding: 8px 16px;
  margin: 4px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
}

.nav button.active {
  background: #2563eb;
}

/* ✅ Container */
.table-container {
  width: 100%;
  background: #111827;
  border-radius: 12px;
  overflow-x: hidden;
}

/* ✅ Tabs */
.tab {
  display: none;
}

.tab.active {
  display: block;
}

/* ✅ Table */
table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
}

th {
  background: #1f2937;
  padding: 6px;
  font-size: 10px;
  color: #9ca3af;
  position: sticky;
  top: 0;
}

td {
  padding: 6px;
  font-size: 11px;
  border-bottom: 1px solid #374151;
}

/* ✅ Content sections (rules/pot) */
.section {
  padding: 20px;
  text-align: left;
}

/* ✅ Styling */
.rank { font-weight: bold; }
.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

</style>
</head>

<body>

<h1>⚽ Mundial 2026 Quiniela</h1>

<!-- ✅ Tabs -->
<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
  <button onclick="showTab('rules', this)">Point Rules</button>
  <button onclick="showTab('pot', this)">Pot</button>
</div>

<!-- ✅ Standings -->
<div id="standings" class="tab active">
  <div class="table-container">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- ✅ Team Stats -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<!-- ✅ Point Rules -->
<div id="rules" class="tab">
  <div class="table-container section">
    <h2>📊 Point Rules</h2>
    <ul>
      <li>Win = 3 points</li>
      <li>Draw = 1 point</li>
      <li>Correct score = bonus points</li>
      <li>Round winners = additional points</li>
    </ul>
  </div>
</div>

<!-- ✅ Pot -->
<div id="pot" class="tab">
  <div class="table-container section">
    <h2>💰 Pot</h2>
    <p>Total pot: $XXX</p>
    <p>1st place: XX%</p>
    <p>2nd place: XX%</p>
    <p>3rd place: XX%</p>
  </div>
</div>

<script>
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ Standings */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  let body = rows.slice(1);

  body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

  let html = "<table>";
  html += "<tr><th>#</th>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  body.forEach((row, i) => {
    let medal = "";
    let cls = "";

    if (i === 0) { medal = "🥇"; cls = "gold"; }
    else if (i === 1) { medal = "🥈"; cls = "silver"; }
    else if (i === 2) { medal = "🥉"; cls = "bronze"; }

    html += `<tr class="${cls}">`;
    html += `<td class="rank">${medal || (i + 1)}</td>`;

    row.forEach((cell, idx) => {
      html += `<td>${cell}</td>`;
    });

    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("table1").innerHTML = html;
});

/* ✅ Team Stats */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "<table>";

  rows.forEach((row, i) => {
    html += "<tr>";
    row.forEach(cell => {
      html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("table2").innerHTML = html;
});
</script>

</body>
</html>
