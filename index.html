<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  padding: 15px;
}

/* ✅ HEADER LAYOUT FIX */
.header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  margin-bottom: 15px;
}

/* ✅ LEFT (Pot) */
.pot-header {
  display: flex;
  gap: 10px;
  justify-content: flex-start;
}

/* ✅ CENTER TITLE */
.title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* ✅ EMPTY RIGHT (keeps center balanced) */
.header-right {
  display: flex;
  justify-content: flex-end;
}

/* ✅ POT CARDS */
.pot-card {
  background: #1f2937;
  padding: 8px 12px;
  border-radius: 8px;
  text-align: center;
  min-width: 80px;
}

.pot-card.total {
  background: #2563eb;
}

.pot-title {
  font-size: 10px;
  color: #9ca3af;
}

.pot-value {
  font-size: 14px;
  font-weight: bold;
}

/* ✅ Tabs */
.nav {
  margin-bottom: 15px;
}

.nav button {
  padding: 8px 16px;
  margin: 4px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
}

/* ✅ Tabs */
.tab { display: none; }
.tab.active { display: block; }

/* ✅ TABLE */
.table-container {
  width: 100%;
  background: #111827;
  border-radius: 12px;
  overflow: hidden;
}

/* 🔥 IMPORTANT FIX: REMOVE table-layout fixed */
table {
  width: 100%;
  border-collapse: collapse;
}

/* ✅ HEADER */
th {
  background: #1f2937;
  padding: 6px;
  font-size: 11px;
  color: #9ca3af;
  text-align: center;
}

/* ✅ CELLS */
td {
  padding: 6px;
  font-size: 11px;
  border-bottom: 1px solid #374151;
  text-align: center;   /* ✅ CENTER DATA */
}

/* ✅ PLAYER COLUMN */
#standings td:nth-child(2),
#standings th:nth-child(2) {
  text-align: left;   /* keep names readable */
  padding-left: 10px;
}

/* ✅ FIX OVERLAP (ALLOW CONTROLLED WRAP) */
#standings th,
#standings td {
  white-space: nowrap;   /* default */
}

/* ✅ ALLOW WRAP ONLY WHERE NEEDED */
#standings th:nth-child(2),
#standings td:nth-child(2),
#standings th:nth-child(4),
#standings th:nth-child(5),
#standings th:nth-child(6),
#standings th:nth-child(7),
#standings td:nth-child(4),
#standings td:nth-child(5),
#standings td:nth-child(6),
#standings td:nth-child(7) {
  overflow: hidden;
  text-overflow: ellipsis; /* ✅ prevents overlap */
}

/* ✅ COLUMN WIDTH CONTROL */
#standings th:nth-child(1),
#standings td:nth-child(1) { width: 4ch; }

#standings th:nth-child(3),
#standings td:nth-child(3) { width: 8ch; }

#standings th:nth-child(8),
#standings td:nth-child(8),
#standings th:nth-child(9),
#standings td:nth-child(9) { width: 6ch; }

/* ✅ SPACING */
#standings th:nth-child(2),
#standings td:nth-child(2) {
  padding-right: 14px;
}

#standings th:nth-child(7),
#standings td:nth-child(7) {
  padding-right: 14px;
}

/* ✅ TOP 3 */
.rank { font-weight: bold; }

.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

</style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">

  <!-- LEFT: POT -->
  <div class="pot-header" id="potHeader">Loading...</div>

  <!-- CENTER: TITLE -->
  <div class="title">⚽ Mundial 2026 Quiniela</div>

  <!-- RIGHT (empty) -->
  <div class="header-right"></div>

</div>

<!-- ✅ Tabs -->
<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
</div>

<!-- ✅ Standings -->
<div id="standings" class="tab active">
  <div class="table-container">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- ✅ Stats -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<script>
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ STANDINGS FIXED */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  const headers = rows[0];
  let body = rows.slice(1);

  body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

  let html = "<table>";

  html += "<tr><th>#</th>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  body.forEach((row, i) => {

    let medal="", cls="";
    if(i===0){medal="🥇";cls="gold";}
    else if(i===1){medal="🥈";cls="silver";}
    else if(i===2){medal="🥉";cls="bronze";}

    html += `<tr class="${cls}">`;
    html += `<td class="rank">${medal || i+1}</td>`;
    row.forEach(c => html += `<td>${c}</td>`);
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("table1").innerHTML = html;
});

/* ✅ TEAM STATS */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "<table>";
  rows.forEach((row,i)=>{
    html+="<tr>";
    row.forEach(c=> html+= i===0?`<th>${c}</th>`:`<td>${c}</td>`);
    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("table2").innerHTML = html;
});

/* ✅ POT HEADER */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=669574522&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  let total = 0;
  let html = "";

  rows.slice(1).forEach(row=>{
    let val = parseFloat(row[1]) || 0;
    total += val;

    html += `
      <div class="pot-card">
        <div class="pot-title">${row[0]}</div>
        <div class="pot-value">$${val}</div>
      </div>
    `;
  });

  html = `
    <div class="pot-card total">
      <div class="pot-title">Total</div>
      <div class="pot-value">$${total}</div>
    </div>
  ` + html;

  document.getElementById("potHeader").innerHTML = html;
});
</script>

</body>
</html>
