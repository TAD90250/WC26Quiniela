<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 Quiniela</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 15px;
}

h1 {
  margin-bottom: 15px;
  font-size: 22px;
}

/* ✅ Tabs */
.nav {
  margin-bottom: 15px;
}

.nav button {
  padding: 8px 16px;
  margin: 4px;
  background: #1f2937;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.nav button.active {
  background: #2563eb;
}

/* ✅ Tabs content */
.tab {
  display: none;
}

.tab.active {
  display: block;
}

/* ✅ Tables */
.table-container {
  width: 100%;
  background: #111827;
  border-radius: 12px;
  overflow-x: hidden;
}

table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
}

th {
  background: #1f2937;
  padding: 6px;
  font-size: 10px;
  color: #9ca3af;
}

td {
  padding: 6px;
  font-size: 11px;
  border-bottom: 1px solid #374151;
}

/* ✅ POT CARDS */
.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #1f2937;
  padding: 20px;
  border-radius: 12px;
  min-width: 150px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.card-title {
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 10px;
}

.card-value {
  font-size: 22px;
  font-weight: bold;
}

</style>
</head>

<body>

<h1>⚽ Mundial 2026 Quiniela</h1>

<!-- ✅ Tabs -->
<div class="nav">
  <button class="active" onclick="showTab('standings', this)">Standings</button>
  <button onclick="showTab('stats', this)">Team Stats</button>
  <button onclick="showTab('pot', this)">Pot</button>
</div>

<!-- ✅ Standings -->
<div id="standings" class="tab active">
  <div class="table-container">
    <div id="table1">Loading...</div>
  </div>
</div>

<!-- ✅ Team Stats -->
<div id="stats" class="tab">
  <div class="table-container">
    <div id="table2">Loading...</div>
  </div>
</div>

<!-- ✅ POT -->
<div id="pot" class="tab">
  <div class="cards" id="potCards">Loading...</div>
</div>

<script>
function showTab(tabId, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));

  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");
}

/* ✅ Standings */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));
  const headers = rows[0];
  let body = rows.slice(1);

  body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

  let html = "<table>";

  html += "<tr><th>#</th>";
  headers.forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  body.forEach((row, i) => {
    html += "<tr>";
    html += `<td>${i+1}</td>`;
    row.forEach(cell => html += `<td>${cell}</td>`);
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("table1").innerHTML = html;
});

/* ✅ Team Stats */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "<table>";

  rows.forEach((row, i) => {
    html += "<tr>";
    row.forEach(cell => {
      html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("table2").innerHTML = html;
});

/* ✅ POT (CARDS VERSION) */
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=669574522&single=true&output=csv")
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "";

  rows.slice(1).forEach(row => {
    const label = row[0];
    const value = row[1];

    html += `
      <div class="card">
        <div class="card-title">${label}</div>
        <div class="card-value">${value}</div>
      </div>
    `;
  });

  document.getElementById("potCards").innerHTML = html;
})
.catch(err => {
  console.error("Pot error:", err);
  document.getElementById("potCards").innerHTML = "Error loading pot";
});
</script>

</body>
</html>
