<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Stats</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

/* ✅ TABS */
.nav {
  margin-bottom: 20px;
}

.nav a {
  display: inline-block;
  padding: 10px 20px;
  margin: 5px;
  background: #1f2937;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

.nav a.active {
  background: #2563eb;
}

.table-container {
  max-width: 1600px;
  margin: auto;
  background: #111827;
  border-radius: 16px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1400px;
}

th {
  background: #1f2937;
  padding: 10px;
  color: #9ca3af;
  position: sticky;
  top: 0;
}

td {
  padding: 10px;
  border-bottom: 1px solid #374151;
  white-space: nowrap;
}

tr:hover {
  background: #1f2937;
}
</style>

</head>

<body>

<!-- ✅ NAV -->
<div class="nav">
  <a href="index.html">Standings</a>
  <a href="Team_Stats.html" class="active">Team Stats</a>
</div>

<h1>📊 Team Stats</h1>

<div class="table-container">
  <div id="table">Loading...</div>
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1485833261&single=true&output=csv";

fetch(url)
.then(res => res.text())
.then(data => {
  let rows = data.trim().split("\n").map(r => r.split(","));

  let html = "<table>";

  rows.forEach((row, i) => {
    html += "<tr>";
    row.forEach(cell => {
      html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("table").innerHTML = html;
});
</script>

</body>
</html>
