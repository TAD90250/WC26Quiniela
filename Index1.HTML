<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Cup Quiniela Standings</title>

<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
  font-size: 30px;
}

/* ✅ NAV TABS */
.nav {
  margin-bottom: 20px;
}

.nav a {
  display: inline-block;
  padding: 10px 20px;
  margin: 5px;
  background: #1f2937;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 14px;
}

.nav a:hover {
  background: #374151;
}

.nav a.active {
  background: #2563eb;
}

/* ✅ WIDE TABLE */
.table-container {
  max-width: 1600px;
  width: 100%;
  margin: auto;
  background: #111827;
  border-radius: 16px;
  overflow-x: auto;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1400px;
}

/* ✅ HEADER */
th {
  background: #1f2937;
  padding: 10px;
  font-size: 12px;
  text-transform: uppercase;
  color: #9ca3af;

  position: sticky;
  top: 0;
  z-index: 2;
  white-space: nowrap;
}

/* ✅ CELLS */
td {
  padding: 10px;
  border-bottom: 1px solid #374151;
  white-space: nowrap;
  font-size: 13px;
}

/* ✅ ONLY COLUMN B WRAPS */
td:nth-child(3),
th:nth-child(3) {
  white-space: normal;
  word-break: break-word;
  max-width: 250px;
}

tr:hover {
  background-color: #1f2937;
}

/* ✅ FIRST COLUMN STICKY */
.name {
  position: sticky;
  left: 0;
  background: #111827;
  z-index: 1;
  text-align: left;
  padding-left: 15px;
}

/* ✅ FIX CORNER */
th:first-child {
  position: sticky;
  left: 0;
  z-index: 3;
}

/* ✅ RANK + MEDALS */
.rank {
  font-weight: bold;
}

.gold { background: #064e3b; }
.silver { background: #78350f; }
.bronze { background: #1e3a8a; }

</style>
</head>

<body>

<!-- ✅ NAVIGATION -->
<div class="nav">
  <a href="index.html" class="active">Standings</a>
  <a href="page2.html">Second Table</a>
</div>

<h1>⚽ World Cup Quiniela Standings</h1>

<div class="table-container">
  <div id="table">Loading...</div>
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTraDGWjLk65weF-hpQFe014jg7A8QXXwI_TaHN7gRfZXjs70I-NnK1_sWGolKMGWrN_DpjT8YrnbpM/pub?gid=1458668677&single=true&output=csv";

fetch(url)
  .then(res => res.text())
  .then(data => {

    let rows = data.trim().split("\n").map(r => r.split(","));

    const headers = rows[0];
    let body = rows.slice(1);

    /* ✅ SORT by last column (points) */
    body.sort((a, b) => Number(b[b.length - 1]) - Number(a[a.length - 1]));

    let html = "<table>";

    /* ✅ HEADER */
    html += "<tr><th>#</th>";
    headers.forEach(h => html += `<th>${h}</th>`);
    html += "</tr>";

    /* ✅ ROWS */
    body.forEach((row, i) => {
      let medal = "";
      let rowClass = "";

      if (i === 0) { medal = "🥇"; rowClass = "gold"; }
      else if (i === 1) { medal = "🥈"; rowClass = "silver"; }
      else if (i === 2) { medal = "🥉"; rowClass = "bronze"; }

      html += `<tr class="${rowClass}">`;

      html += `<td class="rank">${medal || (i + 1)}</td>`;

      row.forEach((cell, idx) => {
        if (idx === 0) {
          html += `<td class="name">${cell}</td>`;
        } else {
          html += `<td>${cell}</td>`;
        }
      });

      html += "</tr>";
    });

    html += "</table>";

    document.getElementById("table").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("table").innerHTML = "Error loading data";
    console.error(err);
  });
</script>

</body>
</html>
